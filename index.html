<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tenglish Bible</title>
  <style>
    :root {
      --bg: #f4f0f8;
      --header-bg: #eae3f1;
      --surface: #ffffff;
      --border: #ded7e8;
      --text: #1d1b20;
      --text-sub: #6c6775;
      --selected: #d8cde9;
      --active-text: #21005d;
      --accent: #6750a4;
    }

    [data-theme="dark"] {
      --bg: #141218;
      --header-bg: #1d192b;
      --surface: #211f26;
      --border: #2d2938;
      --text: #e6e0e9;
      --text-sub: #958da5;
      --selected: #4a4458;
      --active-text: #e8def8;
      --accent: #d0bcff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Bar */
    header {
      background: var(--header-bg);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .top-icons {
      display: flex;
      gap: 16px;
      font-size: 18px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 3 Column Table Layout */
    .table-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--surface);
    }

    .table-header {
      display: flex;
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
    }

    .th-book { flex: 5; text-align: center; padding: 12px 16px; }
    .th-ch { flex: 2; border-left: 1px solid var(--border); border-right: 1px solid var(--border); padding: 12px 6px; }
    .th-ver { flex: 2; padding: 12px 6px; }

    .table-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Columns Scroll */
    .col-book, .col-ch, .col-ver {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .col-book {
      flex: 5;
    }

    .col-ch {
      flex: 2;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      text-align: center;
    }

    .col-ver {
      flex: 2;
      text-align: center;
    }

    /* Item Styles */
    .book-item {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }

    .book-item.selected {
      background-color: var(--selected);
    }

    .book-tenglish {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
    }

    .book-telugu {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .num-item {
      padding: 15px 0;
      border-bottom: 1px solid var(--border);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
    }

    .num-item.selected {
      background-color: var(--selected);
      color: var(--active-text);
      font-weight: 700;
    }

    /* Reader Fullscreen Modal */
    .reader-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--surface);
      display: none;
      flex-direction: column;
      z-index: 100;
    }

    .reader-modal.active {
      display: flex;
    }

    .modal-header {
      background: var(--header-bg);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 20px;
      font-weight: bold;
      color: var(--text);
      cursor: pointer;
    }

    .modal-content {
      flex: 1;
      padding: 20px 16px;
      overflow-y: auto;
      line-height: 1.8;
      font-size: 17px;
    }

    .verse-line {
      margin-bottom: 12px;
      padding: 4px;
      border-radius: 4px;
    }

    .verse-line.highlight {
      background: var(--selected);
    }

    .v-num {
      color: var(--accent);
      font-weight: 700;
      margin-right: 6px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Tenglish Bible</div>
    <div class="top-icons">
      <button class="icon-btn" id="themeBtn" title="Theme">🌙</button>
      <button class="icon-btn" onclick="alert('Tenglish Bible Reader with Chapter & Verse Picker')" title="Info">ⓘ</button>
    </div>
  </header>

  <div class="table-container">
    <div class="table-header">
      <div class="th-book">Book</div>
      <div class="th-ch">Ch.</div>
      <div class="th-ver">Ver.</div>
    </div>
    
    <div class="table-body">
      <!-- 1. Books List -->
      <div class="col-book" id="bookList"></div>

      <!-- 2. Chapters List -->
      <div class="col-ch" id="chList"></div>

      <!-- 3. Verses List -->
      <div class="col-ver" id="verList"></div>
    </div>
  </div>

  <!-- Fullscreen Chapter Reader -->
  <div class="reader-modal" id="readerModal">
    <div class="modal-header">
      <button class="close-btn" id="closeReader">✕</button>
      <div class="modal-title" id="modalTitle">Genesis 1</div>
      <div style="width:24px;"></div>
    </div>
    <div class="modal-content" id="modalContent"></div>
  </div>

  <script>
    // 66 Grandhamula perlu (Tenglish + Telugu Lipi)
    const bibleBooks = [
      { t: "Adikaandamu", te: "ఆదికాండము" },
      { t: "Nirgamakaandamu", te: "నిర్గమకాండము" },
      { t: "Leveyakaandamu", te: "లేవీయకాండము" },
      { t: "Sankhyakaandamu", te: "సంఖ్యాకాండము" },
      { t: "Dviteeyopadesha", te: "ద్వితీయోపదేశకాండము" },
      { t: "Yehoshuva", te: "యెహోషువ" },
      { t: "Nyayadhipathulu", te: "న్యాయాధిపతులు" },
      { t: "Ruthu", te: "రూతు" },
      { t: "1 Samuyelu", te: "1 సమూయేలు" },
      { t: "2 Samuyelu", te: "2 సమూయేలు" },
      { t: "1 Raajulu", te: "1 రాజులు" },
      { t: "2 Raajulu", te: "2 రాజులు" },
      { t: "1 Dinaruttantamulu", te: "1 దినవృత్తాంతములు" },
      { t: "2 Dinaruttantamulu", te: "2 దినవృత్తాంతములు" },
      { t: "Ezra", te: "ఎజ్రా" },
      { t: "Nehemya", te: "నెహెమ్యా" },
      { t: "Esteru", te: "ఎస్తేరు" },
      { t: "Yobu", te: "యోబు" },
      { t: "Keertanalu", te: "కీర్తనలు" },
      { t: "Saamethalu", te: "సామెతలు" },
      { t: "Prasangi", te: "ప్రసంగి" },
      { t: "Parama Geetamulu", te: "పరమగీతము" },
      { t: "Yeshayya", te: "యెషయా" },
      { t: "Yermiya", te: "యిర్మియా" },
      { t: "Vilapavaakyamulu", te: "విలాపవాక్యములు" },
      { t: "Yehejkelu", te: "యెహెజ్కేలు" },
      { t: "Daniyelu", te: "దానియేలు" },
      { t: "Hoseya", te: "హోషేయ" },
      { t: "Yovelu", te: "యోవేలు" },
      { t: "Aamosu", te: "ఆమోసు" },
      { t: "Obadya", te: "ఓబద్యా" },
      { t: "Yona", te: "యోనా" },
      { t: "Meekha", te: "మీకా" },
      { t: "Nahooshu", te: "నహోము" },
      { t: "Habakkuku", te: "హబక్కూకు" },
      { t: "Zefanya", te: "జెఫన్యా" },
      { t: "Haggayi", te: "హగ్గయి" },
      { t: "Zekarya", te: "జెకర్యా" },
      { t: "Malakee", te: "మలాకీ" },
      { t: "Mattheyu", te: "మత్తయి" },
      { t: "Maarku", te: "మార్కు" },
      { t: "Luka", te: "లూకా" },
      { t: "Yohanu", te: "యోహాను" },
      { t: "Aposthula Kaaryamulu", te: "అపొస్తలుల కార్యములు" },
      { t: "Romiyulaku", te: "రోమీయులకు" },
      { t: "1 Korintheelaku", te: "1 కొరింథీయులకు" },
      { t: "2 Korintheelaku", te: "2 కొరింథీయులకు" },
      { t: "Galateeyulaku", te: "గలతీయులకు" },
      { t: "Epheseeyulaku", te: "ఎఫెసీయులకు" },
      { t: "Philippeelaku", te: "ఫిలిప్పీయులకు" },
      { t: "Kolosseeyulaku", te: "కొలొస్సయులకు" },
      { t: "1 Thessalonikeeyulaku", te: "1 థెస్సలొనీకయులకు" },
      { t: "2 Thessalonikeeyulaku", te: "2 థెస్సలొనీకయులకు" },
      { t: "1 Timotheyiki", te: "1 తిమోతికి" },
      { t: "2 Timotheyiki", te: "2 తిమోతికి" },
      { t: "Teethuku", te: "తీతుకు" },
      { t: "Philemonuku", te: "ఫిలేమోనుకు" },
      { t: "Hebreelaku", te: "హెబ్రీయులకు" },
      { t: "Yaakobu", te: "యాకోబు" },
      { t: "1 Pethuru", te: "1 పేతురు" },
      { t: "2 Pethuru", te: "2 పేతురు" },
      { t: "1 Yohanu", te: "1 యోహాను" },
      { t: "2 Yohanu", te: "2 యోహాను" },
      { t: "3 Yohanu", te: "3 యోహాను" },
      { t: "Yooda", te: "యూదా" },
      { t: "Prakatanagrandhamu", te: "ప్రకటన గ్రంథము" }
    ];

    let bibleData = [];
    let selectedBook = 1;
    let selectedChapter = 1;

    const bookList = document.getElementById('bookList');
    const chList = document.getElementById('chList');
    const verList = document.getElementById('verList');
    const readerModal = document.getElementById('readerModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalContent = document.getElementById('modalContent');
    const closeReader = document.getElementById('closeReader');
    const themeBtn = document.getElementById('themeBtn');

    // Theme toggle
    themeBtn.addEventListener('click', () => {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      themeBtn.textContent = isDark ? '🌙' : '☀️';
    });

    // Load JSON Data
    fetch('tenglish_bible.json')
      .then(res => res.json())
      .then(data => {
        bibleData = data;
        renderBooks();
        selectBook(1);
      })
      .catch(err => {
        alert("JSON load error: tenglish_bible.json file repository lo unda?");
      });

    // Render 1st Column (Books)
    function renderBooks() {
      const presentBookNumbers = [...new Set(bibleData.map(i => i.book_number))].sort((a,b)=>a-b);
      bookList.innerHTML = '';

      presentBookNumbers.forEach(num => {
        const item = bibleBooks[num - 1] || { t: `Book ${num}`, te: "" };
        const div = document.createElement('div');
        div.className = `book-item ${num === selectedBook ? 'selected' : ''}`;
        div.id = `book-${num}`;
        div.innerHTML = `
          <div class="book-tenglish">${item.t}</div>
          <div class="book-telugu">${item.te}</div>
        `;
        div.onclick = () => selectBook(num);
        bookList.appendChild(div);
      });
    }

    // Select Book
    function selectBook(num) {
      selectedBook = num;
      document.querySelectorAll('.book-item').forEach(el => el.classList.remove('selected'));
      const cur = document.getElementById(`book-${num}`);
      if (cur) cur.classList.add('selected');

      const chapters = [...new Set(
        bibleData.filter(i => i.book_number === selectedBook).map(i => i.chapter_number)
      )].sort((a,b)=>a-b);

      renderChapters(chapters);
      selectChapter(chapters[0] || 1);
    }

    // Render 2nd Column (Chapters)
    function renderChapters(chapters) {
      chList.innerHTML = '';
      chapters.forEach(ch => {
        const div = document.createElement('div');
        div.className = `num-item ${ch === selectedChapter ? 'selected' : ''}`;
        div.id = `ch-${ch}`;
        div.textContent = ch;
        div.onclick = () => selectChapter(ch);
        chList.appendChild(div);
      });
    }

    // Select Chapter
    function selectChapter(ch) {
      selectedChapter = ch;
      document.querySelectorAll('.col-ch .num-item').forEach(el => el.classList.remove('selected'));
      const cur = document.getElementById(`ch-${ch}`);
      if (cur) cur.classList.add('selected');

      const count = bibleData.filter(i => i.book_number === selectedBook && i.chapter_number === selectedChapter).length;
      renderVerses(count);
    }

    // Render 3rd Column (Verses)
    function renderVerses(count) {
      verList.innerHTML = '';
      for (let v = 1; v <= count; v++) {
        const div = document.createElement('div');
        div.className = 'num-item';
        div.textContent = v;
        div.onclick = () => openVerseReader(v);
        verList.appendChild(div);
      }
    }

    // Open Reader Modal
    function openVerseReader(targetVerse) {
      const verses = bibleData.filter(i => i.book_number === selectedBook && i.chapter_number === selectedChapter);
      const bInfo = bibleBooks[selectedBook - 1] || { t: `Book ${selectedBook}` };

      modalTitle.textContent = `${bInfo.t} ${selectedChapter}`;
      
      let html = '';
      verses.forEach((v, idx) => {
        const vNum = idx + 1;
        const isHighlight = vNum === targetVerse ? 'highlight' : '';
        html += `
          <div class="verse-line ${isHighlight}" id="v-${vNum}">
            <span class="v-num">${vNum}</span>
            <span>${v.text}</span>
          </div>
        `;
      });

      modalContent.innerHTML = html;
      readerModal.classList.add('active');

      setTimeout(() => {
        const el = document.getElementById(`v-${targetVerse}`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 100);
    }

    closeReader.onclick = () => {
      readerModal.classList.remove('active');
    };
  </script>
</body>
</html>
